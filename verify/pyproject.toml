[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veridact-verify"
version = "0.5.0a1"
description = "Reference verifier for Veridact agent presentations: SD-JWT VC, Token Status List, HTTPS identifiers, no call home."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Richard Craig" }]
keywords = ["sd-jwt", "sd-jwt-vc", "token-status-list", "oauth", "ai-agents", "acme"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
# Pinned for reproducible builds (spec: Security and threat model, supply chain).
dependencies = [
  "cryptography==50.0.2",
  "aiohttp==3.14.5",
]

[project.optional-dependencies]
test = ["pytest==8.*", "pytest-asyncio==0.*"]

[project.urls]
Specification = "https://github.com/veridactlabs/veridact/blob/main/docs/specification.md"

[tool.hatch.build.targets.wheel]
packages = ["src/veridact_verify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
