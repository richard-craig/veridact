[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veridact-issuer"
version = "0.1.0a1"
description = "Staging ACME-A issuer for Veridact: Operator and Agent Credentials, status lists, a staging trust list."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Richard Craig" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
# veridact-verify supplies JOSE, did:webvh resolution and the status list encoding,
# so the issuer and every relying party read artefacts with the same code.
dependencies = [
  "veridact-verify==0.1.0a1",
  "cryptography==50.0.2",
  "did-webvh==1.0.1",
  "aiohttp==3.14.5",
]

[project.optional-dependencies]
dns = ["dnspython==2.7.*"]
test = ["pytest==8.*", "pytest-asyncio==0.*", "pytest-aiohttp==1.*"]

[project.scripts]
veridact-issuer = "veridact_issuer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veridact_issuer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
