[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veridact-attester"
version = "0.1.0a1"
description = "Reference known-assistant attester for Veridact v0.5: SD-JWT VC entries about assistant platforms, Token Status List kill switch."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Richard Craig" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "veridact-verify==0.1.0a1",
  "cryptography==50.0.2",
  "aiohttp==3.14.5",
]

[project.optional-dependencies]
test = ["pytest==8.*", "pytest-asyncio==0.*", "pytest-aiohttp==1.*"]

[project.scripts]
veridact-attester = "veridact_attester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veridact_attester"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
