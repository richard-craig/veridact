[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veridact-lambda-authoriser"
version = "0.5.0a1"
description = "API Gateway (REST) Lambda authoriser for Veridact agent presentations, with DynamoDB nonces."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Richard Craig" }]
# boto3 is in the Lambda runtime; it is a dependency here so tests and local runs work.
dependencies = [
  "veridact-verify==0.5.0a1",
  "veridact-sidecar==0.5.0a1",
  "boto3>=1.34",
]

[project.optional-dependencies]
test = ["pytest==8.*", "pytest-asyncio==0.*", "moto[dynamodb]>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/veridact_lambda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
