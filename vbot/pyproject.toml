[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vbot"
version = "0.1.0a1"
description = "The Veridact agent client: Agent Credentials for AI agents, obtained and renewed automatically over ACME-A."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Richard Craig" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "veridact-verify==0.1.0a1",
  "cryptography==50.0.2",
  "did-webvh==1.0.1",
  "aiohttp==3.14.5",
]

[project.optional-dependencies]
test = ["pytest==8.*", "pytest-asyncio==0.*"]

[project.scripts]
vbot = "vbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
