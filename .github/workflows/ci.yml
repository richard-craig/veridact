name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          pip install -e './verify[test]' -e './issuer[dns,test]' -e './vbot[test]' \
                      -e './sidecar[test]' -e './sandbox[test]' \
                      -e './integrations/aws-lambda[test]' cfn-lint
      - name: Verifier and conformance vectors
        run: pytest verify
      - name: End to end (issuer, vbot, sidecar, sandbox)
        run: pytest e2e
      - name: Lambda authoriser
        run: |
          pytest integrations/aws-lambda
          cfn-lint integrations/aws-lambda/template.yaml
      - name: Local demo
        run: deploy/local-demo.sh
