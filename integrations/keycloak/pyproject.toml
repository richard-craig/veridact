[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veridact-keycloak-bridge"
version = "0.5.0a1"
description = "Veridact token exchange for Keycloak: verify an agent's presentation, get a DPoP-bound Keycloak access token through the JWT Authorization Grant."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Richard Craig" }]
dependencies = [
  "veridact-verify==0.5.0a1",
  "veridact-sidecar==0.5.0a1",
  "aiohttp==3.14.5",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.*", "pytest-asyncio==0.*", "pytest-aiohttp==1.*"]

[project.scripts]
veridact-keycloak-bridge = "veridact_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veridact_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
