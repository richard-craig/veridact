[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veridact-sandbox"
version = "0.5.0a1"
description = "Veridact Insurance: a sandbox relying party that challenges agents and explains every decision."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Richard Craig" }]
dependencies = [
  "veridact-verify==0.5.0a1",
  "veridact-sidecar==0.5.0a1",
  "aiohttp==3.14.5",
]

[project.optional-dependencies]
test = ["pytest==8.*", "pytest-asyncio==0.*", "pytest-aiohttp==1.*"]

[project.scripts]
veridact-sandbox = "veridact_sandbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veridact_sandbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
