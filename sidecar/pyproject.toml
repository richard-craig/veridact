[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veridact-sidecar"
version = "0.5.0a1"
description = "The Veridact reference verifier as an HTTP sidecar: /v1/challenge and /v1/verify."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Richard Craig" }]
dependencies = [
  "veridact-verify==0.5.0a1",
  "aiohttp==3.14.5",
]

[project.optional-dependencies]
test = ["pytest==8.*", "pytest-asyncio==0.*", "pytest-aiohttp==1.*"]

[project.scripts]
veridact-sidecar = "veridact_sidecar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veridact_sidecar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
